<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 200" width="100%" height="100%">
  <defs>
    <linearGradient id="disneyArcGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0052D4" />
      <stop offset="50%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
  </defs>
  <!-- Disney Arc over logo -->
  <path d="M 50,70 C 120,20, 240,20, 285,68" stroke="url(#disneyArcGrad)" stroke-width="6" stroke-linecap="round" fill="none" />
  <!-- Disney script + '+' -->
  <text x="35" y="95" fill="#FFFFFF" font-family="'Georgia', serif" font-style="italic" font-weight="bold" font-size="52">Disney</text>
  <text x="245" y="95" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="900" font-size="56">+</text>
  <!-- hotstar lowercase below -->
  <text x="50" y="155" fill="#FFFFFF" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="500" font-size="48" letter-spacing="1">hotstar</text>
</svg>
